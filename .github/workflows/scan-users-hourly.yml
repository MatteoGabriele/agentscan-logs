name: Hourly User Scan

on:
  # Netlify's scheduled function stays the primary trigger. GitHub's scheduler
  # is late and lossy, but as a backstop it only has to catch the hours Netlify
  # drops, and the guard job below makes sure we don't have duplicates..
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: # Allow manual trigger

# Serialised so a re-dispatch never races the run already pushing to main.
concurrency:
  group: scan-results
  cancel-in-progress: false

jobs:
  guard:
    if: github.repository == 'MatteoGabriele/agentscan-logs'
    runs-on: ubuntu-latest
    outputs:
      should-scan: ${{ steps.check.outputs.should-scan }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check whether this hour is already recorded
        id: check
        run: |
          window_start=$(( $(date -u +%s) / 3600 * 3600 - 3600 ))

          git fetch --depth=1 origin main

          if git show FETCH_HEAD:data/hourly-window-scan-results.txt 2>/dev/null \
            | cut -d, -f1 | grep -qx "$window_start"; then
            echo "Window $window_start is already recorded - skipping this run."
            echo "should-scan=false" >> "$GITHUB_OUTPUT"
          else
            echo "Window $window_start is not recorded yet - scanning."
            echo "should-scan=true" >> "$GITHUB_OUTPUT"
          fi

  scan:
    needs: guard
    if: needs.guard.outputs.should-scan == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run user scan
        env:
          # Separate account, so scans draw from their own rate limit bucket.
          NUXT_GITHUB_TOKEN_ANASTELLINE: ${{ secrets.NUXT_GITHUB_TOKEN_ANASTELLINE }}
          PR_HASH_SECRET: ${{ secrets.PR_HASH_SECRET }}
        run: >
          pnpm exec tsx scripts/scan-users.ts
          --output=hourly-window-scan-results.txt
          --max-scans=30
          --daily-output=daily-scan-results.json
          --repo-scores-output=daily-repo-scores.json
          --automation-ids-output=automation-ids.json

      - name: Commit and push results
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Staged-diff check, so the first run picks up the still-untracked files.
          git add data/hourly-window-scan-results.txt data/daily-scan-results.json data/daily-repo-scores.json data/automation-ids.json

          # A day is only rolled up once its last hour is scanned, so this file
          # changes once a day — that is the Discord notification's trigger.
          if git diff --cached --quiet -- data/daily-scan-results.json; then
            echo "daily-rolled-up=false" >> "$GITHUB_OUTPUT"
          else
            echo "daily-rolled-up=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --cached --quiet; then
            echo "No changes detected"
            exit 0
          fi

          timestamp="$(date -u +'%Y-%m-%dT%H:00Z')"
          git commit -m "chore: hourly user scan - $timestamp"
          git fetch origin main

          if git merge --no-edit origin/main && git push; then
            exit 0
          fi

          # Main moved in a way we cannot reconcile unattended (conflicting
          # merge, or a push that lost a race). Park the results on their own
          # branch and let a human resolve it instead of dropping the scan.
          git merge --abort || true

          branch="scan/hourly-$(date -u +'%Y%m%dT%H%M%SZ')"
          git push origin "HEAD:refs/heads/$branch"

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body=$(printf '%s\n\n%s\n\n%s\n' \
            "The hourly scan could not be committed to main automatically — the merge conflicted or the push was rejected. This branch holds the results so the scan is not lost." \
            "**Read the conflict before merging.** The scan rewrites each data file whole rather than appending, so this branch goes stale the moment the next hourly scan lands on main. Resolving in this branch's favour drops every hour in between — permanently for data/daily-scan-results.json and data/automation-ids.json, which are never trimmed." \
            "Run: $run_url")

          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: hourly user scan - $timestamp" \
            --body "$body"

          # A PR here is a recovery artifact, not a success. Fail the run so a
          # persistent cause (branch protection, revoked write) surfaces at once
          # instead of quietly opening a PR every hour.
          echo "::error::Could not push scan results to main; opened $branch as a PR instead."
          exit 1

      - name: Notify Discord
        if: steps.commit.outputs.daily-rolled-up == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.OSS_GUILD_DISCORD_WEBHOOK }}
        run: pnpm exec tsx scripts/notify-discord.ts
